services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchesql
      POSTGRES_PASSWORD: orchesql
      POSTGRES_DB: orchesql
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchesql"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://orchesql:orchesql@db:5432/orchesql
      GROQ_API_KEY: ${GROQ_API_KEY}
      ORCHESQL_MODEL: ${ORCHESQL_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
